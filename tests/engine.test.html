<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Engine Tests · ApartmentWise</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    main { width: min(900px, 100% - 32px); margin: 0 auto; padding: 40px 0 80px; }
    h1 { font-size: 34px; letter-spacing: -1px; margin: 8px 0 6px; }
    h2 { font-size: 16px; margin: 28px 0 8px; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 14px; }
    li { padding: 6px 10px; border-radius: 8px; background: #fff; }
    li.pass { color: #1F5F52; }
    li.fail { color: #A8432F; background: #F6E3DC; font-weight: 700; }
    code { font-weight: 500; font-size: 12px; }
    .summary { font-weight: 800; font-size: 18px; padding: 12px 16px; border-radius: 12px; }
    .summary.good { background: #DCEDE6; color: #1F5F52; }
    .summary.bad { background: #F6E3DC; color: #A8432F; }
  </style>
</head>
<body>
  <main>
    <span class="section-eyebrow">DECISION ENGINE</span>
    <h1>Reference tests</h1>
    <p style="color:var(--muted)">Expected values from the Task 4 specification and docs/data-model.md, run against the 50-listing test dataset.</p>
    <div id="report">Running…</div>
  </main>
  <script src="../js/engine/criteria.js"></script>
  <script src="../js/engine/format.js"></script>
  <script src="../js/engine/ahp.js"></script>
  <script src="../js/engine/engine.js"></script>
  <script src="../js/data/test-dataset.js"></script>
  <script src="../js/data/test-profiles.js"></script>
  <script src="engine.test.js"></script>
</body>
</html>
